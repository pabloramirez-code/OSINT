[project]
name = "reconmap"
version = "0.0.1"
description = "Orquestador de reconocimiento pasivo con interfaz gráfica"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dnspython>=2.9.2",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.3",
    "rich>=15.0.0",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
reconmap-web = "reconmap.web.app:main"

[build-system]
requires = ["uv_build>=0.9,<1.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["CLAUDE.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not network and not e2e' --strict-markers"
markers = [
    "network: hace peticiones reales a servicios externos",
    "e2e: prueba la interfaz en un navegador real con playwright",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]
