<form id="scan-form" class="scan-form" action="/scans" method="post"
      hx-post="/scans" hx-target="#form-error" hx-swap="innerHTML"{% if oob %} hx-swap-oob="true"{% endif %}>
  <div class="field">
    <label for="domain" class="visually-hidden">Dominio</label>
    <input id="domain" name="domain" type="text" placeholder="ejemplo.com"
           autocomplete="off" spellcheck="false" required {{ "disabled" if busy }}>
    <div id="form-error" aria-live="polite"></div>
  </div>
  <fieldset class="segmented" {{ "disabled" if busy }}>
    <legend class="visually-hidden">Modo de contacto</legend>
    <label class="seg seg-passive" title="Solo fuentes públicas: no se envía nada al objetivo">
      <input type="radio" name="authorized" value="" checked>
      <span>Pasivo</span>
    </label>
    <label class="seg seg-light" title="Tengo autorización o es un dominio mío: como mucho una petición por host">
      <input type="radio" name="authorized" value="1">
      <span>Ligero</span>
    </label>
  </fieldset>
  <label class="depth" title="Saltos entre subdominios que se siguen dentro del ámbito">
    Profundidad
    <select name="depth" {{ "disabled" if busy }}>
      {% for level in (1, 2, 3) %}<option value="{{ level }}">{{ level }}</option>{% endfor %}
    </select>
  </label>
  <button type="submit" {{ "disabled" if busy }}>{{ "Escaneando…" if busy else "Escanear" }}</button>
</form>
