<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "42[29]", "swap": true, "error": false}, {"code": "[45]..", "swap": false, "error": true}]}'>
  <title>{% block title %}reconmap{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"
          integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
          crossorigin="anonymous" defer></script>
  <script src="/static/table.js" defer></script>
  <script src="/static/graph.js" defer></script>
</head>
<body>
  <input type="checkbox" id="nav-toggle" class="nav-toggle" hidden>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <a href="/" class="brand"><span class="brand-mark" aria-hidden="true"></span>reconmap</a>
        <label for="nav-toggle" class="nav-button" aria-label="Mostrar menú">☰</label>
      </div>
      <nav class="sidebar-body" aria-label="Principal">
        <ul class="nav">
          <li><a href="/" class="{{ 'current' if section == 'home' }}">Inicio</a></li>
          <li>
            <a href="/projects" class="{{ 'current' if section == 'projects' }}">
              Proyectos <span class="nav-count">{{ project_count }}</span>
            </a>
          </li>
          <li><a href="/settings" class="{{ 'current' if section == 'settings' }}">Ajustes</a></li>
        </ul>
        {% include "partials/active_scan.html" %}
      </nav>
    </aside>
    <main class="content">
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>
