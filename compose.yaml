# docker compose up -d --build  → http://127.0.0.1:8000
#
# El puerto se publica SOLO en 127.0.0.1 del equipo (regla 7): no es accesible desde la red.
# Claves y lista blanca del modo Activo se leen de .env (nunca se copian a la imagen).
services:
  reconmap:
    build: .
    image: reconmap:local
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - reconmap-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 512mb  # Chrome (gowitness) necesita memoria compartida
    restart: unless-stopped

volumes:
  reconmap-data:
